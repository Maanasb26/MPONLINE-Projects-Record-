<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Placement Predictor</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>🎓 Student Placement Predictor</h1>

        <form action="/predict" method="POST">

            <label>CGPA</label>
            <input type="number" step="0.01" name="cgpa" required>

            <label>10th Percentage</label>
            <input type="number" step="0.01" name="tenth" required>

            <label>12th Percentage</label>
            <input type="number" step="0.01" name="twelfth" required>

            <label>Number of Backlogs</label>
            <input type="number" name="backlogs" required>

            <label>Communication Skills (1-10)</label>
            <input type="number" min="1" max="10" name="communication" required>

            <label>Aptitude Score</label>
            <input type="number" name="aptitude" required>

            <label>Projects Completed</label>
            <input type="number" name="projects" required>

            <label>Certifications</label>
            <input type="number" name="certifications" required>

            <label>Attendance (%)</label>
            <input type="number" step="0.01" name="attendance" required>

            <label>Internship</label>
            <select name="internship">
                <option value="Yes">Yes</option>
                <option value="No">No</option>
            </select>

            <label>DSA Level</label>
            <select name="dsa">
                <option value="Beginner">Beginner</option>
                <option value="Intermediate">Intermediate</option>
                <option value="Advanced">Advanced</option>
            </select>

            <button type="submit">Predict Placement</button>

        </form>

        {% if prediction %}
        <div class="result">
            {{ prediction }}
        </div>
        {% endif %}

    </div>

</body>

</html>
